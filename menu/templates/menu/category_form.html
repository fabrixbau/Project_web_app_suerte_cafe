{% extends "base.html" %}

{% block title %}{{ title }} | Suerte Café{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar categoría
        </button>

        <a href="{% url 'menu:configuration' %}">
            Cancelar
        </a>
    </form>
{% endblock %}
