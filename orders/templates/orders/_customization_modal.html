{{ product_customizations|json_script:"product-customizations" }}
<input id="custom-items-input" type="hidden" name="custom_items" value="{{ custom_items_value|default:'[]' }}">
<dialog id="product-customization-dialog" class="customization-dialog">
    <div class="customization-dialog-header">
        <div class="customization-dialog-title"><p class="eyebrow">Personalizar producto</p><h2 id="customization-product-name"></h2></div>
        <div class="customization-dialog-actions">
            <div class="dialog-quantity"><span>Cantidad</span><div class="quantity-control"><button type="button" data-dialog-decrease aria-label="Disminuir cantidad">−</button><strong id="dialog-quantity">1</strong><button type="button" data-dialog-increase aria-label="Aumentar cantidad">+</button></div></div>
            <div class="dialog-price"><span>Precio</span><strong id="dialog-unit-price">$0.00</strong></div>
            <button type="button" id="add-customized-product">Agregar personalizados</button>
        </div>
        <button type="button" class="dialog-close" data-customization-close aria-label="Cerrar">×</button>
    </div>
    <div id="customization-groups" class="order-customization-groups"></div>
    <label class="customization-comment-field" for="customization-comment"><strong>Comentario del producto</strong><textarea id="customization-comment" maxlength="500" rows="3" placeholder="Ej. Sin partir, bien dorado o servir aparte"></textarea><small>Esta indicación corresponde solamente a esta unidad.</small></label>
</dialog>
