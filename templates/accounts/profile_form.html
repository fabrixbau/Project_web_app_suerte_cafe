{% extends "base.html" %}

{% block title %}Mi perfil | Suerte Café{% endblock %}

{% block content %}
    <h1>Mi perfil</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Guardar cambios</button>
    </form>

    <p>
        <a href="{% url 'accounts:password_change' %}">
            Cambiar contraseña
        </a>
    </p>
{% endblock %}
