{% extends "auth_base.html" %}

{% block title %}Registro | Suerte Café{% endblock %}

{% block content %}
    <h1>Crear cuenta</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Crear cuenta</button>
    </form>

    <p>
        <a href="{% url 'login' %}">Regresar al Login</a>
    </p>
{% endblock %}
